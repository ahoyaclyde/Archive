<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - FLUG Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-white mb-6 text-center">Reset Your Password</h1>
        
        {{#if error_message}}
        <div class="mb-6 p-4 bg-red-900/30 border border-red-700 text-red-300 rounded-lg">
            <i class="fas fa-exclamation-triangle mr-2"></i>{{error_message}}
        </div>
        {{/if}}
        
        <form action="/forgot-password" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address:</label>
                <input type="email" name="email" required 
                       class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-red-500">
                <p class="text-sm text-gray-400 mt-1">Enter your email address to receive a password reset link.</p>
            </div>
            <button type="submit" class="w-full bg-red-600 text-white py-3 px-4 rounded-lg hover:bg-red-700 transition-colors font-medium">
                Send Reset Link
            </button>
        </form>
        <div class="text-center mt-6">
            <a href="/login" class="text-red-600 hover:text-red-500">Back to Sign In</a>
        </div>
    </div>
</body>
</html>
